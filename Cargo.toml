[package]
name = "ctwatch"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/purpleempress/ctwatch"
description = "Self-hosted Certificate Transparency mirror with SAN-indexed read API"

[lib]
name = "ctwatch"
path = "src/lib.rs"

[[bin]]
name = "ctwatch"
path = "src/main.rs"

[dependencies]
# runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# http
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# db
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
hex = "0.4"

# crypto + parsing
sha2 = "0.10"
hmac = "0.12"
x509-parser = "0.16"
publicsuffix = "2"

# cli + config
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["env", "yaml"] }

# logging + metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }

# error handling + misc
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
